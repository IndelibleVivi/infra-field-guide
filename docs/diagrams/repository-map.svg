<text id="title" data-container-id="" fill="#163a5f" font-size="34" font-weight="700" text-anchor="start"><tspan x="40" y="62">仓库架构 · 文字帮助决策，工具在本地生成快照</tspan></text>
<text id="subtitle" data-container-id="" fill="#365775" font-size="19" font-weight="400" text-anchor="start"><tspan x="40" y="101">这是仓库已有的 source 结构；与前五张参考部署图分开。没有常驻 dashboard server、自动调度器或远程执行器。</tspan></text>
<text id="reading-plane-heading" data-container-id="" fill="#365775" font-size="22" font-weight="700" text-anchor="start"><tspan x="60" y="192">人读与 agent 阅读面</tspan></text>
<text id="reading-plane-sub" data-container-id="" fill="#365775" font-size="16" font-weight="400" text-anchor="start"><tspan x="60" y="220">内容是参考；真实操作授权来自 owner</tspan></text>
<rect id="docs" x="65" y="250" width="395" height="150" rx="16" fill="#e9f7fc" stroke="#6ab9db" stroke-width="2" stroke-dasharray=""/>
<text id="docs-text" data-container-id="docs" fill="#163a5f" font-size="20" font-weight="400" text-anchor="start"><tspan x="83" y="289" font-weight="700">README.md → docs/</tspan><tspan x="83" y="316">从买机、SSH、运维到迁移与网络</tspan><tspan x="83" y="343">章节说明命令位置、预期与恢复</tspan><tspan x="83" y="370">architecture.md 连接各条路径</tspan></text>
<rect id="workorders" x="65" y="490" width="395" height="150" rx="16" fill="#e9f7fc" stroke="#6ab9db" stroke-width="2" stroke-dasharray=""/>
<text id="workorders-text" data-container-id="workorders" fill="#163a5f" font-size="20" font-weight="400" text-anchor="start"><tspan x="83" y="529" font-weight="700">agents/ · 工单文本</tspan><tspan x="83" y="556">先盘点目标、权限与证据</tspan><tspan x="83" y="583">再提出可审查操作与验收</tspan><tspan x="83" y="610">不含执行器、凭据或隐含授权</tspan></text>
<rect id="examples" x="65" y="730" width="395" height="160" rx="16" fill="#e9f7fc" stroke="#6ab9db" stroke-width="2" stroke-dasharray=""/>
<text id="examples-text" data-container-id="examples" fill="#163a5f" font-size="20" font-weight="400" text-anchor="start"><tspan x="83" y="774" font-weight="700">examples/ · 合成输入</tspan><tspan x="83" y="801">迁移计划、inventory、SSH / grant</tspan><tspan x="83" y="828">health-demo.json 是固定合成快照</tspan><tspan x="83" y="855">不含真实主机与账号数据</tspan></text>
<rect id="guide-workorder-label-bg" x="131" y="428" width="264" height="26.950000000000003" rx="16" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-dasharray=""/>
<text id="guide-workorder-label" data-container-id="" fill="#365775" font-size="17" font-weight="400" text-anchor="middle"><tspan x="263" y="447">依据与阅读跳转</tspan></text>
<rect id="template-workorder-label-bg" x="130" y="668" width="265" height="26.950000000000003" rx="16" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-dasharray=""/>
<text id="template-workorder-label" data-container-id="" fill="#365775" font-size="17" font-weight="400" text-anchor="middle"><tspan x="262.5" y="687">只作模板</tspan></text>
<text id="health-plane-heading" data-container-id="" fill="#365775" font-size="22" font-weight="700" text-anchor="start"><tspan x="545" y="192">本地工具 · tools/health.py · Python 标准库</tspan></text>
<text id="health-plane-sub" data-container-id="" fill="#365775" font-size="16" font-weight="400" text-anchor="start"><tspan x="545" y="220">按命令运行一次；无网络、SSH、提权、常驻服务或自动刷新。</tspan></text>
<rect id="linux-input" x="560" y="250" width="430" height="155" rx="16" fill="#ffffff" stroke="#6ab9db" stroke-width="2" stroke-dasharray=""/>
<text id="linux-input-text" data-container-id="linux-input" fill="#163a5f" font-size="20" font-weight="400" text-anchor="start"><tspan x="578" y="291.5" font-weight="700">真实采集 · 仅 Linux</tspan><tspan x="578" y="318.5">/proc：load、RAM、swap、uptime、PSI</tspan><tspan x="578" y="345.5">statvfs(/)：根文件系统字节与 inodes</tspan><tspan x="578" y="372.5">未读 cgroup；缺失指标记 unknown</tspan></text>
<rect id="collect" x="560" y="500" width="430" height="135" rx="16" fill="#e9f7fc" stroke="#6ab9db" stroke-width="2" stroke-dasharray=""/>
<text id="collect-text" data-container-id="collect" fill="#163a5f" font-size="20" font-weight="400" text-anchor="start"><tspan x="578" y="545" font-weight="700">collect → schema v1 JSON</tspan><tspan x="578" y="572">只读指标；只写显式新输出文件</tspan><tspan x="578" y="599">--demo 改读 fixture，不读取本机</tspan></text>
<rect id="snapshot" x="1070" y="500" width="450" height="135" rx="16" fill="#ffffff" stroke="#6ab9db" stroke-width="2" stroke-dasharray=""/>
<text id="snapshot-text" data-container-id="snapshot" fill="#163a5f" font-size="20" font-weight="400" text-anchor="start"><tspan x="1088" y="545" font-weight="700">JSON 快照</tspan><tspan x="1088" y="572">采集时间、来源声明、metrics</tspan><tspan x="1088" y="599">source 是声明，不是来源认证</tspan></text>
<rect id="render" x="1070" y="710" width="450" height="95" rx="16" fill="#e9f7fc" stroke="#6ab9db" stroke-width="2" stroke-dasharray=""/>
<text id="render-text" data-container-id="render" fill="#163a5f" font-size="20" font-weight="400" text-anchor="start"><tspan x="1088" y="748.5" font-weight="700">render INPUT.json -o OUTPUT.html</tspan><tspan x="1088" y="775.5">校验 schema / 数值，重算状态并转义</tspan></text>
<rect id="html" x="1070" y="860" width="450" height="90" rx="16" fill="#ffffff" stroke="#6ab9db" stroke-width="2" stroke-dasharray=""/>
<text id="html-text" data-container-id="html" fill="#163a5f" font-size="20" font-weight="400" text-anchor="start"><tspan x="1088" y="896" font-weight="700">离线 HTML · 快照看板</tspan><tspan x="1088" y="923">内嵌 CSS；没有 JS / 外部请求 / 刷新</tspan></text>
<rect id="read-proc-label-bg" x="621" y="435" width="310" height="26.950000000000003" rx="16" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-dasharray=""/>
<text id="read-proc-label" data-container-id="" fill="#365775" font-size="17" font-weight="400" text-anchor="middle"><tspan x="776" y="454">用户在获准 Linux 上运行</tspan></text>
<rect id="output-boundary" x="560" y="710" width="430" height="240" rx="16" fill="#fff5d9" stroke="#e7c979" stroke-width="2" stroke-dasharray=""/>
<text id="output-boundary-text" data-container-id="output-boundary" fill="#163a5f" font-size="20" font-weight="400" text-anchor="start"><tspan x="578" y="767" font-weight="700">输出边界</tspan><tspan x="578" y="794">reports/ 是本地生成结果，不入 Git。</tspan><tspan x="578" y="821">输出文件必须不存在，不覆盖旧快照。</tspan><tspan x="578" y="848">HTML 年龄在生成时计算，之后不更新。</tspan><tspan x="578" y="875">只看资源余量，不能证明服务可用。</tspan><tspan x="578" y="902">不会上传；跨机器复制由 owner 决定。</tspan></text>
<text id="verification-plane-heading" data-container-id="" fill="#365775" font-size="22" font-weight="700" text-anchor="start"><tspan x="60" y="1052">验证面 · tests/</tspan></text>
<text id="verification-plane-sub" data-container-id="" fill="#365775" font-size="16" font-weight="400" text-anchor="start"><tspan x="60" y="1080">合成测试保护 source 契约；部署与真实客户端验收留在所选运行环境。</tspan></text>
<text id="tests-body" data-container-id="" fill="#163a5f" font-size="20" font-weight="400" text-anchor="start"><tspan x="65" y="1115">test_health.py：合成 /proc、statvfs、JSON / CLI / HTML　　test_docs.py：相对链接、锚点、shell 静态语法、JSON 示例</tspan></text>
<text id="tests-limit" data-container-id="" fill="#365775" font-size="19" font-weight="400" text-anchor="start"><tspan x="65" y="1159">测试通过 ≠ 真实 Linux 采集 ≠ 已安装 / 已启动 ≠ 网络可达 ≠ 真实客户端成功。图像渲染也不验证 health HTML 布局。</tspan></text>
<text id="footer" data-container-id="" fill="#365775" font-size="16" font-weight="400" text-anchor="start"><tspan x="40" y="1244">实线：本地工具的数据流　虚线：--demo 可选输入　点线：文档依据 / 模板关系。此图是 source 架构，不是自动运行的生产流水线。</tspan></text></g>
</svg>
