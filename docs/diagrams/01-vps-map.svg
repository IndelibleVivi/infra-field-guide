<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 394" width="720" height="394" role="img" aria-labelledby="title desc">
<title id="title">一台 VPS，先看四件事</title><desc id="desc">从任务出发，分别核对算力、容量、网络和恢复能力。 先写需求，再比套餐；“便宜”要连同恢复成本一起看。</desc>
<rect width="720" height="394" rx="12" fill="#f4fafc"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<text x="28" y="40" font-size="23" font-weight="600" fill="#203e56">一台 VPS，先看四件事</text>
<g id="step-1"><rect x="28" y="76" width="324" height="138" rx="8" fill="#ffffff" stroke="#c8dfe9"/>
<g transform="translate(43,91)" fill="none" stroke="#296583" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h12v12H6z M9 1v4 M15 1v4 M9 19v4 M15 19v4 M1 9h4 M1 15h4 M19 9h4 M19 15h4"/></g>
<text x="80" y="109" font-size="18" font-weight="600" fill="#203e56">算得动</text>
<text x="44" y="143" font-size="17" font-weight="400" fill="#203e56">vCPU 处理任务</text>
<text x="44" y="168" font-size="17" font-weight="400" fill="#203e56">RAM 容纳正在用的数据</text>
</g>
<g id="step-2"><rect x="368" y="76" width="324" height="138" rx="8" fill="#ffffff" stroke="#c8dfe9"/>
<g transform="translate(383,91)" fill="none" stroke="#296583" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h8l2 3h10v12H2z M2 6V3h8l2 3h8v3"/></g>
<text x="420" y="109" font-size="18" font-weight="600" fill="#203e56">放得下</text>
<text x="384" y="143" font-size="17" font-weight="400" fill="#203e56">磁盘存文件与数据库</text>
<text x="384" y="168" font-size="17" font-weight="400" fill="#203e56">留出日志、更新的余量</text>
</g>
<g id="step-3"><rect x="28" y="234" width="324" height="138" rx="8" fill="#ffffff" stroke="#c8dfe9"/>
<g transform="translate(43,249)" fill="none" stroke="#296583" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h12 M12 2l3 3-3 3 M21 19H9 M12 16l-3 3 3 3 M3 5v10a4 4 0 0 0 4 4 M21 19V9a4 4 0 0 0-4-4"/></g>
<text x="80" y="267" font-size="18" font-weight="600" fill="#203e56">连得上</text>
<text x="44" y="301" font-size="17" font-weight="400" fill="#203e56">地区、IP、带宽与流量</text>
<text x="44" y="326" font-size="17" font-weight="400" fill="#203e56">分别影响路径和用量</text>
</g>
<g id="step-4"><rect x="368" y="234" width="324" height="138" rx="8" fill="#ffffff" stroke="#c8dfe9"/>
<g transform="translate(383,249)" fill="none" stroke="#296583" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5a5 5 0 1 1-4 8L3 20H1v-4l8-7 M4 15l3 3"/></g>
<text x="420" y="267" font-size="18" font-weight="600" fill="#203e56">回得来</text>
<text x="384" y="301" font-size="17" font-weight="400" fill="#203e56">console 应急进入</text>
<text x="384" y="326" font-size="17" font-weight="400" fill="#203e56">异机备份 + 恢复演练</text>
</g>
</g>
</svg>
