<!doctype html>
<html lang="$lang">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <meta name="theme-color" content="#163a5f">
  <meta property="og:title" content="$title · Infra Field Guide">
  <meta property="og:description" content="$description">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://indeliblevivi.github.io${base}docs/assets/drinking-fawn.png">
  <link rel="canonical" href="$canonical">
  <link rel="icon" href="${base}assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="${base}assets/site.css">
  <script defer src="${base}assets/site.js"></script>
  <title>$title · Infra Field Guide</title>
</head>
<body data-base="$base">
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <a class="brand" href="$base" aria-label="Infra Field Guide 首页">
      <img class="brand-mark" src="${base}assets/favicon.svg" width="40" height="40" alt="">
      <span>Infra <i>Field Guide</i><small>给自己的基础设施，一份说明书。</small></span>
    </a>
    <nav class="header-links" aria-label="主导航"><a href="${base}#chapters">读手册</a><a href="${base}maps/">看地图</a><a href="${base}glossary/">查术语</a><a href="$repo" title="本项目 GitHub 仓库">GitHub ↗</a></nav>
    <div class="header-actions"><button class="search-trigger" type="button" aria-label="搜索手册" aria-haspopup="dialog" hidden><svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m12 12 5 5" stroke="currentColor" stroke-width="1.6"/></svg><span>搜索手册</span><kbd>/</kbd></button><button class="menu-trigger" type="button" aria-haspopup="dialog" hidden>目录 ☰</button></div>
  </header>
  $body
  <footer class="site-footer"><div><a class="footer-title" href="$base">Infra Field Guide</a><p>把路径讲清楚，把服务安顿好。</p><a href="https://github.com/IndelibleVivi">GitHub · @IndelibleVivi ↗</a></div><div class="footer-links"><a href="${base}sources/">来源与维护</a><a href="${base}licensing/">许可与归属</a><a href="${base}en/" lang="en">English introduction</a><span>文档 CC BY-NC-SA 4.0 · 代码 SUL-1.0</span></div></footer>
  <dialog class="search-dialog" aria-labelledby="search-title">
    <div class="dialog-top"><h2 id="search-title">在手册里找一找</h2><button class="dialog-close" type="button" aria-label="关闭搜索">关闭 ×</button></div>
    <label class="visually-hidden" for="search-input">搜索章节、命令或问题</label>
    <input id="search-input" type="search" placeholder="试试：swap、迁移、住宅代理…" autocomplete="off">
    <p class="search-status" role="status" aria-live="polite">输入关键词，搜索全部章节与工单。</p>
    <div class="search-results"></div>
    <div class="search-hint">关键词只在当前浏览器中检索。<span>Esc 关闭</span></div>
  </dialog>
  <dialog class="menu-dialog" aria-labelledby="menu-title"><div class="dialog-top"><h2 id="menu-title">手册目录</h2><button class="dialog-close" type="button" aria-label="关闭目录">关闭 ×</button></div><nav class="mobile-nav" aria-label="全书目录">$nav</nav></dialog>
  <dialog class="term-dialog" aria-labelledby="term-title">
    <div class="dialog-top"><p class="eyebrow">MOONLIGHT NOTE / 随手查词</p><button class="dialog-close" type="button" aria-label="关闭术语解释">关闭 ×</button></div>
    <h2 id="term-title"></h2><p class="term-definition"></p><a class="text-link term-more">到词表继续阅读 →</a>
  </dialog>

</html>
