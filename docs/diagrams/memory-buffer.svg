<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" width="720" height="236" role="img" aria-labelledby="title desc">
<title id="title">RAM 与 swap，怎样分工</title><desc id="desc">这是内存工作方式的概念示意，不是你机器的实时使用率。 OOM 还可能由 cgroup 限制或 systemd-oomd 触发。</desc>
<rect width="720" height="236" rx="12" fill="#f4fafc"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<text x="28" y="40" font-size="23" font-weight="600" fill="#203e56">RAM 与 swap，怎样分工</text>
<g id="step-1"><rect x="28" y="76" width="324" height="138" rx="8" fill="#ffffff" stroke="#c8dfe9"/>
<g transform="translate(43,91)" fill="none" stroke="#296583" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h12v12H6z M9 1v4 M15 1v4 M9 19v4 M15 19v4 M1 9h4 M1 15h4 M19 9h4 M19 15h4"/></g>
<text x="80" y="109" font-size="18" font-weight="600" fill="#203e56">RAM · 当前工作台</text>
<text x="44" y="143" font-size="17" font-weight="400" fill="#203e56">活跃数据主要在这里</text>
<text x="44" y="168" font-size="17" font-weight="400" fill="#203e56">超额工作集需要降载或扩容</text>
</g>
<g id="step-2"><rect x="368" y="76" width="324" height="138" rx="8" fill="#ffffff" stroke="#c8dfe9"/>
<g transform="translate(383,91)" fill="none" stroke="#296583" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h8l2 3h10v12H2z M2 6V3h8l2 3h8v3"/></g>
<text x="420" y="109" font-size="18" font-weight="600" fill="#203e56">swap · 磁盘缓冲</text>
<text x="384" y="143" font-size="17" font-weight="400" fill="#203e56">可换出部分不活跃匿名页</text>
<text x="384" y="168" font-size="17" font-weight="400" fill="#203e56">持续换入换出可能拖慢整机</text>
</g>
</g>
</svg>
