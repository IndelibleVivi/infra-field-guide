<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 258" width="720" height="258" role="img" aria-labelledby="title desc">
<title id="title">搬家，先让新家独立跑通</title><desc id="desc">本机仍负责正式服务时，先验证 VPS 的兼容性、恢复与服务管理。 Mac 的 GUI、钥匙串与本地路径，不会自动变成 Linux 服务。</desc>
