<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 605" width="360" height="605" role="img" aria-labelledby="title desc">
<title id="title">先留一条回来的路</title><desc id="desc">保持 console 与旧 SSH 会话可用，第二次登录验证成功后才继续收紧。 验证完成前，保留原会话与 console。</desc>
<rect width="360" height="605" rx="12" fill="#f4fafc"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<text x="20" y="40" font-size="19" font-weight="600" fill="#203e56">先留一条回来的路</text>
<g id="step-1"><rect x="20" y="76" width="320" height="108" rx="8" fill="#ffffff" stroke="#c8dfe9"/>
<g transform="translate(35,91)" fill="none" stroke="#296583" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v7H3z M3 14h18v7H3z M6 6h1 M6 17h1 M11 6h7 M11 17h7"/></g>
<text x="72" y="109" font-size="18" font-weight="600" fill="#203e56">打开 console</text>
<text x="36" y="143" font-size="16" font-weight="400" fill="#203e56">服务商恢复入口</text>
<text x="36" y="168" font-size="16" font-weight="400" fill="#203e56">SSH 失败时排障</text>
</g>
<path d="M180.0 188v17m-4-5 4 5 4-5" stroke="#477f9c" stroke-width="1.5" fill="none"/>
<g id="step-2"><rect x="20" y="209" width="320" height="108" rx="8" fill="#ffffff" stroke="#c8dfe9"/>
<g transform="translate(35,224)" fill="none" stroke="#296583" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5a5 5 0 1 1-4 8L3 20H1v-4l8-7 M4 15l3 3"/></g>
<text x="72" y="242" font-size="18" font-weight="600" fill="#203e56">核对 host key</text>
<text x="36" y="276" font-size="16" font-weight="400" fill="#203e56">可信渠道核验</text>
<text x="36" y="301" font-size="16" font-weight="400" fill="#203e56">确认目标主机</text>
</g>
<path d="M180.0 321v17m-4-5 4 5 4-5" stroke="#477f9c" stroke-width="1.5" fill="none"/>
<g id="step-3"><rect x="20" y="342" width="320" height="108" rx="8" fill="#ffffff" stroke="#c8dfe9"/>
<g transform="translate(35,357)" fill="none" stroke="#296583" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h12 M12 2l3 3-3 3 M21 19H9 M12 16l-3 3 3 3 M3 5v10a4 4 0 0 0 4 4 M21 19V9a4 4 0 0 0-4-4"/></g>
<text x="72" y="375" font-size="18" font-weight="600" fill="#203e56">独立登录</text>
<text x="36" y="409" font-size="16" font-weight="400" fill="#203e56">新用户与密钥</text>
<text x="36" y="434" font-size="16" font-weight="400" fill="#203e56">另开会话测权限</text>
</g>
<path d="M180.0 454v17m-4-5 4 5 4-5" stroke="#477f9c" stroke-width="1.5" fill="none"/>
<g id="step-4"><rect x="20" y="475" width="320" height="108" rx="8" fill="#ffffff" stroke="#c8dfe9"/>
<g transform="translate(35,490)" fill="none" stroke="#296583" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L21 5 M21 12v8H3V3h12"/></g>
<text x="72" y="508" font-size="18" font-weight="600" fill="#203e56">收紧后再测</text>
<text x="36" y="542" font-size="16" font-weight="400" fill="#203e56">认证与防火墙</text>
<text x="36" y="567" font-size="16" font-weight="400" fill="#203e56">每改一项重测</text>
</g>
</g>
</svg>
