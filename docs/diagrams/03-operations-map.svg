<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 258" width="720" height="258" role="img" aria-labelledby="title desc">
<title id="title">运维，把这三个环节连起来</title><desc id="desc">主机指标给出线索；服务记录解释原因；真实操作验证是否恢复。 一个绿色读数，只能证明它测量的那一层。</desc>
<rect width="720" height="258" rx="12" fill="#f4fafc"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<text x="28" y="40" font-size="23" font-weight="600" fill="#203e56">运维，把这三个环节连起来</text>
<g id="step-1"><rect x="28.0" y="76" width="205.33333333333334" height="160" rx="8" fill="#ffffff" stroke="#c8dfe9"/>
<g transform="translate(43.0,91)" fill="none" stroke="#296583" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h12v12H6z M9 1v4 M15 1v4 M9 19v4 M15 19v4 M1 9h4 M1 15h4 M19 9h4 M19 15h4"/></g>
<text x="44.0" y="137" font-size="18" font-weight="600" fill="#203e56">看资源</text>
<text x="44.0" y="171" font-size="17" font-weight="400" fill="#203e56">CPU / RAM / 磁盘</text>
<text x="44.0" y="196" font-size="17" font-weight="400" fill="#203e56">容量与压力一起看</text>
</g>
<path d="M236.33333333333334 156.0h18m-5-4 5 4-5 4" stroke="#477f9c" stroke-width="1.5" fill="none"/>
<g id="step-2"><rect x="257.33333333333337" y="76" width="205.33333333333334" height="160" rx="8" fill="#ffffff" stroke="#c8dfe9"/>
<g transform="translate(272.33333333333337,91)" fill="none" stroke="#296583" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v18H3z M6 8h12 M6 12h8 M6 16h10"/></g>
<text x="273.33333333333337" y="137" font-size="18" font-weight="600" fill="#203e56">找原因</text>
<text x="273.33333333333337" y="171" font-size="17" font-weight="400" fill="#203e56">服务 owner 与日志</text>
<text x="273.33333333333337" y="196" font-size="17" font-weight="400" fill="#203e56">对齐故障发生的时间</text>
</g>
<path d="M465.66666666666674 156.0h18m-5-4 5 4-5 4" stroke="#477f9c" stroke-width="1.5" fill="none"/>
<g id="step-3"><rect x="486.6666666666667" y="76" width="205.33333333333334" height="160" rx="8" fill="#ffffff" stroke="#c8dfe9"/>
<g transform="translate(501.6666666666667,91)" fill="none" stroke="#296583" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L21 5 M21 12v8H3V3h12"/></g>
<text x="502.6666666666667" y="137" font-size="18" font-weight="600" fill="#203e56">验恢复</text>
<text x="502.6666666666667" y="171" font-size="17" font-weight="400" fill="#203e56">从真实客户端完成任务</text>
<text x="502.6666666666667" y="196" font-size="17" font-weight="400" fill="#203e56">也要演练备份还原</text>
</g>
</g>
</svg>
