<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 236" width="720" height="236" role="img" aria-labelledby="title desc">
<title id="title">先保存资产，再选清理范围</title><desc id="desc">A 与 B 是两条不同的本地整理路径；共同前提是完整私有备份。 共同起点：私有备份 → 共同终点：验证资产与本地环境。</desc>
<rect width="720" height="236" rx="12" fill="#f4fafc"/>
<g font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif">
<text x="28" y="40" font-size="23" font-weight="600" fill="#203e56">先保存资产，再选清理范围</text>
<g id="step-1"><rect x="28" y="76" width="324" height="138" rx="8" fill="#ffffff" stroke="#c8dfe9"/>
<g transform="translate(43,91)" fill="none" stroke="#296583" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h8l2 3h10v12H2z M2 6V3h8l2 3h8v3"/></g>
<text x="80" y="109" font-size="18" font-weight="600" fill="#203e56">A · 选定状态清理</text>
<text x="44" y="143" font-size="17" font-weight="400" fill="#203e56">只隔离清单列出的四项</text>
<text x="44" y="168" font-size="17" font-weight="400" fill="#203e56">其他认证来源需单独处理</text>
</g>
<g id="step-2"><rect x="368" y="76" width="324" height="138" rx="8" fill="#ffffff" stroke="#c8dfe9"/>
<g transform="translate(383,91)" fill="none" stroke="#296583" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18v7H3z M3 14h18v7H3z M6 6h1 M6 17h1 M11 6h7 M11 17h7"/></g>
<text x="420" y="109" font-size="18" font-weight="600" fill="#203e56">B · 完整环境重建</text>
<text x="384" y="143" font-size="17" font-weight="400" fill="#203e56">隔离完整用户配置</text>
<text x="384" y="168" font-size="17" font-weight="400" fill="#203e56">按需重装，再选择性恢复</text>
</g>
</g>
</svg>
